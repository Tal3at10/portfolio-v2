<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="bg-nexgo-1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="glow-nexgo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg-nexgo-1)" />
  <rect x="40" y="40" width="1120" height="670" rx="16" fill="#09090b" stroke="url(#glow-nexgo)" stroke-width="2" />
  
  <rect x="40" y="40" width="1120" height="48" rx="16" fill="#18181b" />
  <circle cx="70" cy="64" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="90" cy="64" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="110" cy="64" r="6" fill="#10b981" opacity="0.8" />
  <text x="150" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">nexgo.app/marketplace/multi-sector</text>

  <!-- 6 Sectors Header -->
  <rect x="80" y="110" width="1040" height="130" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="110" y="150" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f43f5e">NexGo Super App — 6 متكاملة في منظومة واحدة</text>
  <text x="110" y="180" font-family="system-ui, sans-serif" font-size="13" fill="#a1a1aa">مطاعم • بقالة وسوبرماركت • صيدلية ودواء • طرود وشحن • تأجير سيارات • توصيل ركاب (RideShare)</text>

  <!-- 3 Apps Mockup Boxes -->
  <rect x="80" y="260" width="330" height="420" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="105" y="300" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f43f5e">تطبيق العميل (Customer App)</text>
  <text x="105" y="325" font-family="system-ui, sans-serif" font-size="12" fill="#71717a">Next.js 15 SSR + Flutter 3.x</text>
  <rect x="105" y="345" width="280" height="90" rx="8" fill="#27272a" />
  <text x="120" y="380" font-family="system-ui, sans-serif" font-size="13" fill="#e4e4e7">تصفح المتاجر وتحديد الموقع الجغرافي</text>
  <text x="120" y="405" font-family="system-ui, sans-serif" font-size="12" fill="#f43f5e">Google Maps API دقيق</text>

  <rect x="435" y="260" width="330" height="420" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="460" y="300" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#8b5cf6">تطبيق الكابتن (Driver App)</text>
  <text x="460" y="325" font-family="system-ui, sans-serif" font-size="12" fill="#71717a">Real-time GPS + WebSockets</text>
  <rect x="460" y="345" width="280" height="90" rx="8" fill="#27272a" />
  <text x="475" y="380" font-family="system-ui, sans-serif" font-size="13" fill="#e4e4e7">استقبال الطلبات بـ 1-sec Socket</text>
  <text x="475" y="405" font-family="system-ui, sans-serif" font-size="12" fill="#10b981">تتبع المسار وأرباح المحفظة</text>

  <rect x="790" y="260" width="330" height="420" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="815" y="300" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#06b6d4">تطبيق المتجر (Vendor POS)</text>
  <text x="815" y="325" font-family="system-ui, sans-serif" font-size="12" fill="#71717a">Thermal Bluetooth ESC/POS</text>
  <rect x="815" y="345" width="280" height="90" rx="8" fill="#27272a" />
  <text x="830" y="380" font-family="system-ui, sans-serif" font-size="13" fill="#e4e4e7">طباعة الفواتير حرارياً عبر البلوتوث</text>
  <text x="830" y="405" font-family="system-ui, sans-serif" font-size="12" fill="#06b6d4">إدارة المخزون وتجهيز الطلب</text>
</svg>
